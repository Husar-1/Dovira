<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Довіра — цифрові послуги</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--blue:#3A86FF;--gold:#FFBE0B;--mut:#6b7480;--ln:#e3e7eb}
*{box-sizing:border-box;margin:0;font-family:inherit}
body{font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;background:#F3F5F7;color:var(--ink);min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 15% 8%,#E2ECF5,transparent),radial-gradient(50% 40% at 90% 85%,#F5EFE6,transparent)}
#app{max-width:448px;margin:0 auto;min-height:100vh;padding:0 16px 96px}#app.wide{max-width:1100px;padding-bottom:40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-weight:800;font-size:30px;letter-spacing:-.5px}.logo.sm{font-size:22px}
h1{font-size:34px;line-height:1.1;letter-spacing:-1px;margin:28px 0 10px}h2{font-size:24px;letter-spacing:-.5px;margin:6px 0 14px}.ua,.mut,small{color:var(--mut)}.ua{font-weight:500;font-size:16px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ln);margin-top:10px}.btn.sm{width:auto;padding:8px 16px;font-size:13px;display:inline-block;margin:0}
input,select,textarea{width:100%;padding:14px 18px;border:1px solid var(--ln);border-radius:999px;background:#fff;font-size:15px;margin-bottom:10px}
textarea{border-radius:24px;min-height:80px}input[type=checkbox]{width:auto;margin:0 8px 0 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.seg{display:flex;background:#e6eaee;border-radius:999px;padding:4px;margin:18px 0}.seg.sm{margin:0}
.seg button{flex:1;border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}.seg .on{background:var(--ink);color:#fff}
.or{text-align:center;color:var(--mut);margin:14px 0 4px}.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}
.box{background:#fff;border-radius:28px;padding:18px;margin-bottom:12px;box-shadow:0 6px 22px rgba(30,50,80,.07)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#e6eaee}
.pill.issued,.pill.approved,.pill.verified{background:#dcebff;color:#1b5fd1}.pill.pending{background:#fff3cc;color:#8a6200}.pill.rejected,.pill.flagged{background:var(--ink);color:#fff}
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:calc(100% - 32px);max-width:416px;display:flex;background:#fff;border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(30,50,80,.18);z-index:5}
.nav button{flex:1;border:0;background:none;padding:8px 4px;border-radius:999px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .25s}
.nav .on{background:var(--ink);color:#fff}.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.deck{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:6px 16px 22px;scrollbar-width:none}
.slot{position:relative;flex:0 0 92%;scroll-snap-align:center;perspective:1200px}
.card{position:relative;height:250px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.35,.5,1);cursor:pointer}.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(135deg,#fff 30%,var(--c));box-shadow:0 10px 30px rgba(30,50,80,.13);overflow:hidden;display:flex;flex-direction:column}
.back{transform:rotateY(180deg);background:#fff;align-items:center;justify-content:center;gap:8px}
.shim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 48%,rgba(58,134,255,.12) 52%,transparent 65%);background-size:250% 100%;animation:shim 4.5s ease-in-out infinite}
@keyframes shim{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
.num{font-size:26px;font-weight:800;letter-spacing:1px;margin:auto 0 8px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}.kv small{display:block;font-size:10px}
.dots{position:absolute;top:14px;right:16px;z-index:3;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.8);font-weight:800;cursor:pointer}
.menu{display:none;position:absolute;top:52px;right:16px;z-index:4;background:#fff;border-radius:20px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:190px}.menu.open{display:block;animation:up .2s}
.menu button{display:block;width:100%;text-align:left;padding:10px 14px;border:0;background:none;border-radius:14px;font-size:14px;cursor:pointer}.menu button:hover{background:#f1f4f7}
.qr{width:128px;height:128px}.qr svg{width:100%;height:100%}.bar{width:150px;height:30px}.tm{font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue)}
.pills{display:flex;gap:8px;overflow-x:auto;margin:4px 0 14px;scrollbar-width:none}.pills button{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}.pills .on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sv{text-align:left;background:#fff;border:0;border-radius:28px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 22px rgba(30,50,80,.07);transition:transform .2s cubic-bezier(.3,1.5,.5,1)}.sv:active{transform:scale(.96)}
.sv i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;margin-bottom:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px 10px}
.sk{height:72px;border-radius:28px;margin-bottom:10px;background:linear-gradient(90deg,#e8ecf0,#f6f8fa,#e8ecf0);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.mo{position:fixed;inset:0;background:rgba(17,17,17,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#F3F5F7;width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:32px 32px 0 0;padding:24px}.sheet,.toast{animation:up .35s cubic-bezier(.3,1.3,.5,1)}@keyframes up{from{transform:translateY(30px);opacity:0}}
.steps{display:flex;gap:6px;margin:10px 0 16px}.steps b{flex:1;height:4px;border-radius:4px;background:#d5dbe1}.steps .on{background:var(--ink)}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:50;font-weight:600;font-size:14px}
.pin{text-align:center;padding-top:60px}.pd{display:flex;gap:14px;justify-content:center;margin:24px 0}.pd i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}.pd .on{background:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}.kp button{height:76px;border-radius:50%;border:0;background:#fff;font-size:24px;font-weight:700;cursor:pointer}.kp button:active{background:var(--ink);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{width:auto;flex:1;min-width:160px;margin:0}
.sc{overflow-x:auto;border-radius:24px}.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:14px}.tbl th{text-align:left;padding:12px 14px;color:var(--mut);font-size:12px;border-bottom:1px solid var(--ln)}.tbl td{padding:11px 14px;border-bottom:1px solid #f0f2f4;white-space:nowrap}.tbl tr:hover td{background:#f8fafc}
.flag{background:#fff8e1;border:1px solid var(--gold)}.field-error{color:#c62828!important;display:block;margin:-6px 8px 10px;font-size:12px}.invalid{border-color:#c62828!important}
.stats{display:flex;gap:10px;margin-bottom:12px}.stats .box{flex:1;margin:0}.stats b{font-size:26px;display:block}
button{color:inherit}
.qr{width:140px;height:140px}.qr svg{border-radius:8px}.vi{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:30px;font-weight:800;background:#ffe9a8;color:#111}.vi.ok{background:#dcebff;color:#1b5fd1}
.face{color:#111}.face small{color:#6b7480}.dots{color:#111}
.deck{position:relative;user-select:none;cursor:grab}.deck::-webkit-scrollbar{display:none}
.dw{position:relative}.arr{position:absolute;top:110px;z-index:4;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#111;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:24px;line-height:1;cursor:pointer;transition:transform .2s}.arr:hover{transform:scale(1.1)}.arr.l{left:-8px}.arr.r{right:-8px}
.dn{display:flex;gap:8px;justify-content:center;margin:-8px 0 12px}.dn button{width:8px;height:8px;border:0;border-radius:8px;background:#c4ccd4;cursor:pointer;padding:0;transition:all .25s}.dn .on{width:24px;background:var(--ink)}
.ph{position:absolute;right:20px;top:56px;width:62px;height:78px;border-radius:14px;overflow:hidden;z-index:1}
.avs{display:inline-block;vertical-align:middle;width:34px;height:34px;border-radius:50%;overflow:hidden;margin-right:10px;flex:none;font-size:13px}.avs.lg{width:64px;height:64px;margin:0;font-size:20px}
.avs img,.ph img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.av{display:grid;place-items:center;width:100%;height:100%;font-weight:800;color:#111;background:#dbe8f8;border-radius:inherit;font-size:inherit}
.sv:hover{transform:translateY(-2px)}.btn:hover{opacity:.88}.pills button:hover,.seg button:hover{opacity:.8}
@media(hover:none){.arr{display:none}}
[data-theme=dark]{color-scheme:dark;--ink:#f2f4f7;--mut:#98a2b0;--ln:#2b3139}
[data-theme=dark] body{background:#0d0f12}
[data-theme=dark] body:before{background:radial-gradient(60% 40% at 15% 8%,#14253a,transparent),radial-gradient(50% 40% at 90% 85%,#2a2214,transparent)}
[data-theme=dark] :where(.box,.sv,.nav,.menu,.tbl,input,select,textarea,.arr){background:#1a1d22;color:var(--ink)}
[data-theme=dark] :where(.btn,.toast){color:#111}
[data-theme=dark] .btn.ghost{background:#1a1d22}
[data-theme=dark] .sheet{background:#13161a}[data-theme=dark] .flag{background:#2a2312}
[data-theme=dark] .seg,[data-theme=dark] .pill{background:#262b32}
[data-theme=dark] .seg .on,[data-theme=dark] .nav .on,[data-theme=dark] .pills .on,[data-theme=dark] .pill.rejected,[data-theme=dark] .pill.flagged,[data-theme=dark] .kp button:active{color:#111}
[data-theme=dark] .pill.issued,[data-theme=dark] .pill.approved,[data-theme=dark] .pill.verified{background:#16304f;color:#8ab8ff}
[data-theme=dark] .pill.pending{background:#3a2f10;color:#ffd666}
[data-theme=dark] .pills button:not(.on),[data-theme=dark] .kp button:not(:active){background:#1a1d22}
[data-theme=dark] .steps b:not(.on){background:#2b3139}[data-theme=dark] .dn button:not(.on){background:#3a424c}
[data-theme=dark] .menu button:hover{background:#262b32}
[data-theme=dark] .tbl td{border-color:#242930}[data-theme=dark] .tbl tr:hover td{background:#20242a}
[data-theme=dark] .sk{background:linear-gradient(90deg,#1a1d22,#242930,#1a1d22);background-size:200% 100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ desktop / PC responsive layout ============ */
@media (min-width:768px){
  #app{width:min(100% - 64px,1180px);max-width:1180px;padding:0 0 56px}
  #app.wide{width:min(100% - 64px,1440px);max-width:1440px;padding-bottom:48px}
  .top{gap:14px;justify-content:flex-start;padding:22px 0 28px;flex-wrap:wrap}
  .top .logo{margin-right:auto}
  h1{font-size:clamp(42px,5vw,60px);max-width:760px;margin:48px 0 14px}
  #app:not(.wide)>.top~h1,#app:not(.wide)>.top~p{max-width:760px}
  #af{max-width:560px;display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
  #af input,#af select,#af small,#af .hint{grid-column:1/-1}
  #af .btn{grid-column:1/-1;justify-self:start;min-width:190px}
  .or{max-width:560px;text-align:left;margin:20px 0 10px}
  #app:not(.wide)>.btn{display:inline-flex;width:auto;min-width:220px;margin:0 10px 10px 0}
  .hint{max-width:560px;text-align:left}
  #main{min-width:0}
  #main>.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .sv{min-height:150px;padding:20px}
  .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;margin:0;padding:10px 0 26px;overflow:visible;scroll-snap-type:none;cursor:default}
  .slot{flex:none;width:100%;max-width:none}
  .arr,.dn{display:none!important}
  .card{height:270px}
  .nav{position:sticky;left:auto;bottom:auto;transform:none;width:min(100%,620px);max-width:620px;margin:28px auto 0}
  .nav button{font-size:12px;padding:10px}
  .mo{align-items:center;padding:28px}
  .sheet{width:min(100%,680px);max-width:680px;max-height:min(86vh,900px);border-radius:28px;padding:30px}
  .sheet>.btn{width:auto;min-width:130px;margin:10px 8px 0 0}
  .sheet input,.sheet select,.sheet textarea{max-width:100%}
  .tools{align-items:center}
  .tools input{flex:1 1 280px;max-width:420px}
  .tools select{flex:0 1 220px;max-width:240px}
  .tools .btn{flex:0 0 auto}
  .stats{max-width:760px}
  .stats .box{min-width:180px}
  .box{padding:22px}
  .row>.btn{flex:0 0 auto}
  .btn:not(.sm){display:inline-flex;width:auto;min-width:148px;max-width:100%;align-items:center;justify-content:center;white-space:normal}
  .btn.ghost{margin-top:0}
  .menu .btn,.nav .btn{width:100%}
  .seg{width:max-content;max-width:100%}
  .seg button{flex:0 0 auto}
  .sc{max-width:100%}
}
@media (min-width:1100px){
  #main>.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stats{gap:16px}
  .box{border-radius:24px}
  .admin-layout,.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:18px}
}
@media (max-width:767px){
  .btn:not(.sm){width:100%}
  .sheet>.btn{width:100%}
}

</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.12/pdfmake.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.12/vfs_fonts.js"></script></head><body><div id="app"></div><div id="modal"></div>
<script>
/* ============ CONFIG: switch backend here ============ */
const DB_PROVIDER='local';                 // 'local' | 'supabase'
const SUPA={url:'',key:''};                // Supabase project URL + anon key (when DB_PROVIDER='supabase')

/* ============ helpers ============ */
const $=s=>document.querySelector(s),mem={};
const st={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const jget=(k,d)=>{try{return JSON.parse(st.get(k))??d}catch(e){return d}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=translateString(m);document.body.append(t);setTimeout(()=>t.remove(),2400)};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const toB64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const randomBytes=n=>crypto.getRandomValues(new Uint8Array(n));
async function deriveSecret(secret,salt,iterations=210000){
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(secret)),'PBKDF2',false,['deriveBits']);
 return toB64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations,hash:'SHA-256'},key,256));
}
async function hashPassword(password,salt=randomBytes(16)){return{salt:toB64(salt),hash:await deriveSecret(password,salt)}}
async function verifyPassword(password,salt,expected){try{return(await deriveSecret(password,fromB64(salt)))===expected}catch{return false}}
async function hashPin(pin,salt=randomBytes(16)){return{salt:toB64(salt),hash:await deriveSecret(pin,salt,120000)}}
const ago=t=>{const s=Math.floor((Date.now()-t)/1e3);return s<10?'щойно':s<60?s+' с тому':Math.floor(s/60)+' хв тому'};
const skel=n=>'<div class="sk"></div>'.repeat(n);
const download=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()};

/* ============ data model + deterministic generator (1,200 citizens) ============ */
/** Citizen {id,name,surname,email,pass,role,dob,taxId,passport,license,city,vehicle:{plate,model},status:'verified'|'pending'|'flagged'}
 *  ServiceRequest {id,userId,userName,serviceId,title,status:'pending'|'issued'|'approved'|'rejected',note,serial,createdAt} */
const FN=['Олена','Андрій','Марія','Іван','Софія','Тарас','Наталія','Олег','Дарина','Максим','Ірина','Богдан','Юлія','Сергій','Анна','Владислав'];
const LN=['Коваленко','Шевченко','Бондаренко','Ткаченко','Мельник','Кравчук','Олійник','Гончар','Мороз','Лисенко','Савченко','Петренко','Руденко','Павленко'];
const CITY=['Київ','Одеса','Львів','Харків','Дніпро','Івано-Франківськ','Чернівці','Вінниця'];
const CARS=['Škoda Octavia','Renault Duster','Toyota Corolla','VW Golf','Nissan Leaf','Hyundai Tucson'];
const yr=y=>y<.1?2008+Math.floor(y*130):1960+Math.floor((y-.1)/.9*43);
const mk=(i,seed=1000+i)=>{const r=rng(seed),p=a=>a[Math.floor(r()*a.length)],d=n=>Array.from({length:n},()=>Math.floor(r()*10)).join('');
 const x=r();return{id:'c'+i,name:p(FN),surname:p(LN),email:`user${i}@demo.ua`,pass:'demo1234',role:'citizen',
 dob:`${yr(r())}-${String(1+Math.floor(r()*12)).padStart(2,'0')}-${String(1+Math.floor(r()*28)).padStart(2,'0')}`,
 taxId:d(10),passport:d(9),license:'AB'+d(6),city:p(CITY),vehicle:{plate:`AA${d(4)}KX`,model:p(CARS)},status:x<.8?'verified':x<.93?'pending':'flagged',flags:x<.93?[]:[{type:['Під розслідуванням','Ризик шахрайства','Іноземний агент'][Math.floor(r()*3)],reason:'Імпортовано з початкових даних реєстру',at:1700000000000,by:'system'}]}};
/* ============ SEED USERS: add your own people here ============
 Omitted fields (tax ID, passport, licence, vehicle...) are generated automatically.
 photo = image URL, data: URI, or '' for an initials avatar. role = 'citizen' | 'admin'. docs = optional list of card keys: id tax dl veh zp stu pen mil vpo med.
 Applies to the local database; in Supabase mode insert rows into the users table instead. */
const CUSTOM_USERS=[
 {name:'Богдан',surname:'Мазур',email:'bohdan@demo.ua',pass:'demo1234',city:'Одеса',dob:'1992-03-14',role:'citizen',photo:'',docs:['id','tax','mil','med']},
 {name:'Катерина',surname:'Левченко',email:'kate@demo.ua',pass:'demo1234',city:'Львів',dob:'1988-11-02',role:'admin',photo:'',docs:['id','tax','dl','veh','zp']},
];
const customUser=(c,i)=>{const u={...mk(2000+i,hash(c.email)),id:'x'+i,role:'citizen',status:'verified',flags:[],...c};if(ageOf(u)<18)u.docs=(u.docs||startDocs(u)).filter(k=>eligible(u,k,[]).ok);return u};
const ADMIN={...mk(5000),id:'admin',name:'Адміністратор',surname:'Реєстру',dob:'1985-01-01',email:'admin@demo.ua',pass:'admin1234',role:'admin',status:'verified',flags:[]};

/* ============ DatabaseAdapter (interface): every UI call goes through these methods ============
 findByEmail(email) getCitizen(id) listCitizens({q,status,page,size}) createCitizen(u) importCitizens(arr)
 listRequests(userId|null) createRequest(r) updateRequest(id,patch) log(action,detail) exportAll()        */
const DB_NAME='dovira-store',DB_STORE='records';
let idbPromise;
function openIDB(){
 if(!('indexedDB'in window))return Promise.reject(new Error('IndexedDB недоступна'));
 if(!idbPromise)idbPromise=new Promise((resolve,reject)=>{

async function idbGet(k){const d=await openIDB();return new Promise((resolve,reject)=>{const r=d.transaction(DB_STORE).objectStore(DB_STORE).get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}

const validateCitizen=(u,i=0)=>{
 const errors=[];
 if(!u||typeof u!=='object'||Array.isArray(u))return [`Рядок ${i+1}: очікується об’єкт`];
 for(const k of ['id','taxId','dob','surname','name','passport'])if(typeof u[k]!=='string'||!u[k].trim())errors.push(`Рядок ${i+1}: відсутнє поле ${k}`);
 if(u.id&&u.id.length>128)errors.push(`Рядок ${i+1}: некоректний id`);
 if(u.taxId&&!/^\\d{10}$/.test(u.taxId))errors.push(`Рядок ${i+1}: taxId має містити 10 цифр`);
 if(u.passport&&!/^\\d{9}$/.test(u.passport))errors.push(`Рядок ${i+1}: passport має містити 9 цифр`);
 if(u.dob&&(!/^\\d{4}-\\d{2}-\\d{2}$/.test(u.dob)||isNaN(Date.parse(u.dob))||new Date(u.dob)>new Date()))errors.push(`Рядок ${i+1}: некоректна дата dob`);
 if(u.name&&u.name.length>100||u.surname&&u.surname.length>100)errors.push(`Рядок ${i+1}: надто довге ім’я`);
 return errors;
};

 }

class SupabasePostgresAdapter{
 async q(path,o={}){
  if(!SUPA.url||!SUPA.key)throw new Error('Налаштуйте SUPA.url і SUPA.key перед використанням Supabase.');
  try{
   const r=await fetch(SUPA.url.replace(/\/$/,'')+'/rest/v1/'+path,{...o,headers:{apikey:SUPA.key,Authorization:'Bearer '+SUPA.key,'Content-Type':'application/json',Prefer:'count=exact,return=representation',...o.headers}});
   const body=await r.text();if(!r.ok)throw new Error(`Supabase ${r.status}: ${body.slice(0,500)}`);
   let data=[];if(body)try{data=JSON.parse(body)}catch{throw new Error('Supabase повернув некоректний JSON')}
   return{data,total:+(r.headers.get('content-range')||'*/0').split('/')[1]};
  }catch(e){throw new Error('Помилка бази даних: '+e.message)}
 }
 async findByEmail(e){return(await this.q('users?email=eq.'+encodeURIComponent(e.toLowerCase())+'&limit=1')).data[0]||null}
 async getCitizen(id){return(await this.q('users?id=eq.'+encodeURIComponent(id))).data[0]||null}
 async listCitizens({q='',status='',page=0,size=15}){let p=`users?role=eq.citizen&order=surname&limit=${size}&offset=${page*size}`;if(status)p+='&status=eq.'+status;if(q)p+=`&or=(name.ilike.*${q}*,surname.ilike.*${q}*,taxId.like.*${q}*,passport.like.*${q}*,license.ilike.*${q}*)`;const r=await this.q(p);return{rows:r.data,total:r.total}}
 async createCitizen(u){return(await this.q('users',{method:'POST',body:JSON.stringify(u)})).data[0]}
 async importCitizens(a){
  if(!Array.isArray(a))throw new Error('Очікується JSON-масив громадян.');
  const errors=a.flatMap((u,i)=>validateCitizen(u,i));if(errors.length)throw new Error(errors.slice(0,8).join('; '));
  const safe=a.map(u=>{const x={...u};delete x.pass;return x});
  const r=await this.q('users?on_conflict=id',{method:'POST',body:JSON.stringify(safe),headers:{Prefer:'resolution=ignore-duplicates,return=representation'}});return r.data.length
 }
 async listRequests(uid){return(await this.q('requests?order=createdAt.desc'+(uid?'&userId=eq.'+uid:''))).data}
 async createRequest(r){return(await this.q('requests',{method:'POST',body:JSON.stringify(r)})).data[0]}
 async updateRequest(id,p){return(await this.q('requests?id=eq.'+id,{method:'PATCH',body:JSON.stringify(p)})).data[0]}
 async log(action,detail){await this.q('audit_logs',{method:'POST',body:JSON.stringify({action,detail,at:Date.now()})}).catch(()=>{})}
 async updateCitizen(id,p){return(await this.q('users?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(p)})).data[0]}
 async listLogs(){return(await this.q('audit_logs?order=at.desc&limit=100')).data}
 async deleteCitizen(id){await this.q('requests?userId=eq.'+encodeURIComponent(id),{method:'DELETE'});await this.q('users?id=eq.'+encodeURIComponent(id),{method:'DELETE'})}
 async reset(){throw new Error('Адміністративне скидання Supabase вимкнено. Виконайте окрему захищену серверну процедуру після резервного копіювання; клієнтський anon key не повинен мати права очищення таблиць.')}
 async exportAll(){return{citizens:(await this.q('users?limit=5000')).data,requests:await this.listRequests()}}
}

async function makePDF(title,subtitle,rows,filename){
 const safeRows=rows.map(([k,v])=>[String(k),String(v??'—')]);
 try{
  if(window.pdfMake?.createPdf){
   const body=[['Поле','Значення'],...safeRows];
   const def={pageSize:'A4',pageMargins:[42,58,42,48],watermark:{text:'ДЕМО',color:'#d9e2ef',opacity:.22,bold:true,fontSize:76,angle:315},
    content:[{text:'ДОВІРА',style:'brand'},{canvas:[{type:'line',x1:0,y1:5,x2:510,y2:5,lineWidth:1,lineColor:'#1e5391'}],margin:[0,8,0,18]},
     {text:title,style:'title'},{text:subtitle,style:'sub',margin:[0,0,0,18]},
     {table:{headerRows:1,widths:['34%','66%'],body},layout:'lightHorizontalLines'},
     {text:'Демо-витяг. Не є офіційним державним документом.',style:'warning',margin:[0,28,0,8]},
     {text:'Сформовано: '+new Date().toLocaleString('uk-UA'),style:'footer'}],
    styles:{brand:{fontSize:22,bold:true,color:'#1e5391',characterSpacing:1},title:{fontSize:17,bold:true,color:'#19232e'},sub:{fontSize:10,color:'#647080'},warning:{fontSize:9,color:'#a34b28',italics:true},footer:{fontSize:8,color:'#8993a0'}},defaultStyle:{font:'Roboto',fontSize:10,color:'#202832'}};
   window.pdfMake.createPdf(def).download(filename);
   toast('PDF підготовлено.');return true;
  }
  if(window.jspdf?.jsPDF){
   const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});doc.setFontSize(18);doc.text('DOVIRA — DEMO',20,24);doc.setFontSize(14);doc.text(String(title),20,42);doc.setFontSize(10);doc.text(String(subtitle),20,50);
   let y=64;for(const [k,v] of safeRows){const lines=doc.splitTextToSize(k+': '+v,170);if(y+lines.length*6>275){doc.addPage();y=20}doc.text(lines,20,y);y+=lines.length*6+2}
   doc.setTextColor(160,70,40);doc.text('DEMO — not an official government document',20,285);doc.save(filename);toast('PDF підготовлено.');return true;
  }
  throw new Error('PDF libraries unavailable');
 }catch(err){
  const escHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const html='<!doctype html><html lang="uk"><meta charset="utf-8"><title>'+escHtml(title)+'</title><style>body{font:16px/1.5 Arial,sans-serif;max-width:800px;margin:48px auto;padding:0 24px;color:#202832}h1{color:#1e5391}table{width:100%;border-collapse:collapse;margin:24px 0}td{padding:10px;border-bottom:1px solid #ddd}td:first-child{font-weight:bold;width:34%}.water{border:2px solid #b55;padding:12px;color:#a34b28;font-weight:bold;text-align:center}</style><h1>ДОВІРА</h1><h2>'+escHtml(title)+'</h2><p>'+escHtml(subtitle)+'</p><table>'+safeRows.map(([k,v])=>'<tr><td>'+escHtml(k)+'</td><td>'+escHtml(v)+'</td></tr>').join('')+'</table><p class="water">ДЕМО — НЕ Є ОФІЦІЙНИМ ДЕРЖАВНИМ ДОКУМЕНТОМ</p><small>Сформовано '+escHtml(new Date().toLocaleString('uk-UA'))+'</small></html>';
  try{const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename.replace(/\.pdf$/i,'.html');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('PDF-бібліотеки недоступні. Завантажено HTML-версію витягу.');return false}
  catch(fallbackError){modal('<h2>Попередній перегляд витягу</h2><div class="box"><b>'+escHtml(title)+'</b><p>'+escHtml(subtitle)+'</p>'+safeRows.map(([k,v])=>'<p><b>'+escHtml(k)+':</b> '+escHtml(v)+'</p>').join('')+'<p class="field-error">ДЕМО — не офіційний документ.</p></div><button class="btn" data-act="close">Закрити</button>');toast('Не вдалося завантажити файл. Відкрито попередній перегляд.');return false}
 }

const t=(key)=>{const lang=st.get('lang')||'uk';return lang==='en'?(I18N[key]??key):key};
function translateString(value){if((st.get('lang')||'uk')!=='en')return value;let out=String(value??'');for(const [uk,en] of Object.entries(I18N).sort((a,b)=>b[0].length-a[0].length))if(out.includes(uk))out=out.split(uk).join(en);return out;}
const translateUI=()=>{const en=(st.get('lang')||'uk')==='en';document.documentElement.lang=en?'en':'uk';if(!en)return;document.documentElement.lang=en?'en':'uk';if(!en)return;for(const root of [document.querySelector('#app'),document.querySelector('#modal')]){if(!root)continue;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){let value=translateString(n.nodeValue);if(value!==n.nodeValue)n.nodeValue=value}root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(x=>['placeholder','title','aria-label'].forEach(a=>{if(x.hasAttribute(a)){let value=translateString(x.getAttribute(a));x.setAttribute(a,value)}}))}};
const langObserver=new MutationObserver(()=>{if(st.get('lang')==='en')translateUI()});for(const root of [document.querySelector('#app'),document.querySelector('#modal')])if(root)langObserver.observe(root,{childList:true,subtree:true,characterData:true});
/* ============ avatars, theme ============ */
const EASTER_PHOTO='https://upload.wikimedia.org/wikipedia/commons/e/ec/%D0%9E%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80_%D0%90%D1%80%D0%BA%D0%B0%D0%B4%D1%96%D0%B9%D0%BE%D0%B2%D0%B8%D1%87_%D0%A2%D1%96%D0%BD%D0%B3%D0%B0%D1%94%D0%B2.jpg';
const easterOn=()=>st.get('easter_egg')==='on';
const dName=u=>easterOn()?'Олександр Аркадійович':(u?.name||'');
const dSurname=u=>easterOn()?'Тінгаєв':(u?.surname||'');
const dFull=u=>`${dSurname(u)} ${dName(u)}`.trim();
const ini=u=>easterOn()?'ОТ':((dName(u)||'?')[0]+((dSurname(u)||'')[0]||'')).toUpperCase();
const phFail=i=>i.replaceWith(Object.assign(document.createElement('span'),{className:'av',textContent:i.dataset.i}));
const av=u=>{const p=easterOn()?EASTER_PHOTO:u?.photo;return p?`<img src="${esc(p)}" alt="" draggable="false" data-i="${ini(u)}" onerror="phFail(this)">`:`<span class="av" style="background:hsl(${hash(u?.id||u?.email||'x')%360} 55% 82%)">${ini(u)}</span>`;};
const readPhoto=f=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const c=document.createElement('canvas'),m=Math.min(i.width,i.height);c.width=c.height=240;c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,240,240);ok(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)});
const applyTheme=()=>{const t=st.get('theme')||'system';document.documentElement.dataset.theme=t=='dark'||(t=='system'&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'};
document.documentElement.lang=st.get('lang')||'uk';applyTheme();try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme)}catch(e){}

/* ============ PC support: arrows, drag-to-scroll, keyboard, Esc, "/" ============ */
const dIdx=()=>{const d=$('#deck');return Math.max(0,Math.min(d.children.length-1,Math.round(d.scrollLeft/(d.children[0].offsetWidth+14))))};
const deckTo=i=>{const d=$('#deck');if(!d)return;const c=d.children[Math.max(0,Math.min(d.children.length-1,i))];d.scrollTo({left:c.offsetLeft-(d.clientWidth-c.offsetWidth)/2,behavior:'smooth'})};
document.addEventListener('scroll',e=>{if(e.target.id=='deck'){const i=dIdx();document.querySelectorAll('#dn button').forEach((b,j)=>b.classList.toggle('on',i==j))}},true);
let dg=null;
document.addEventListener('pointerdown',e=>{if(window.innerWidth>=768)return;const d=e.target.closest('#deck');if(d&&e.pointerType=='mouse'&&!e.target.closest('.dots,.menu'))dg={d,x:e.clientX,l:d.scrollLeft,m:0}});
document.addEventListener('pointermove',e=>{if(!dg)return;const dx=e.clientX-dg.x;if(Math.abs(dx)>5&&!dg.m){dg.m=1;dg.d.style.scrollSnapType='none';dg.d.style.cursor='grabbing'}if(dg.m)dg.d.scrollLeft=dg.l-dx});
document.addEventListener('pointerup',()=>{if(!dg)return;const g=dg;if(g.m){g.d.style.scrollSnapType='';g.d.style.cursor='';deckTo(dIdx())}setTimeout(()=>{if(dg===g)dg=null})});
document.addEventListener('click',e=>{if(dg?.m){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('keydown',e=>{const t=e.target,typing=/INPUT|TEXTAREA|SELECT/.test(t.tagName),open=$('#modal').innerHTML;
 if(e.key=='Escape'&&open)modal('');
 if((e.key=='Enter'||e.key==' ')&&t.classList?.contains('card')){e.preventDefault();t.classList.toggle('flip')}
 if(S.pin){const b=e.key=='Backspace'?'del':e.key;document.querySelector('.kp [data-act="key"][data-v="'+b+'"]')?.click();return}if(typing||open||!S.u)return;
 if(S.view=='app'&&S.tab=='docs'&&$('#deck')&&(e.key=='ArrowRight'||e.key=='ArrowLeft')){e.preventDefault();deckTo(dIdx()+(e.key=='ArrowRight'?1:-1))}
 if(e.key=='/'&&S.view=='admin'&&$('#aq')){e.preventDefault();$('#aq').focus()}});

/* ============ admin: add / edit citizen form ============ */
function userForm(u,isNew){S.pic=u.photo||'';S.ef={id:u.id,isNew,base:u};
 const f=(id,l,v,t='text')=>`<small>${l}</small><input id="uf_${id}" type="${t}" value="${esc(v)}">`;
 modal(`<h2>${isNew?'Додати громадянина':'Редагувати громадянина'}</h2><div class="row" style="justify-content:flex-start;gap:14px;margin-bottom:12px"><span class="avs lg" id="pv">${av(u)}</span><div><button class="btn sm ghost" data-act="pickph">Завантажити фото</button> <button class="btn sm ghost" data-act="rmph">Прибрати</button><input type="file" id="ph" accept="image/*" hidden></div></div>
 ${f('name','Ім’я',u.name)}${f('surname','Прізвище',u.surname)}${f('email','Електронна пошта',u.email,'email')}${f('pass',isNew?'Пароль':'Новий пароль (порожньо — без змін)',isNew?'demo1234':'')}${f('city','Місто',u.city)}${f('dob','Дата народження',u.dob,'date')}${f('tax','РНОКПП (10 цифр)',u.taxId)}${f('pid','Номер паспорта (9 цифр)',u.passport)}${f('lic','Посвідчення водія',u.license)}${f('plate','Номерний знак',u.vehicle.plate)}
 <small>Документи (адмін може видати будь-який)</small><div class="tools" style="margin:6px 0 12px">${Object.keys(CARDS).map(k=>`<label style="font-size:13px;white-space:nowrap"><input type="checkbox" class="dk" value="${k}" ${hasDocs(u).includes(k)?'checked':''}>${CARDS[k]}</label>`).join('')}</div><small>Роль</small><select id="uf_role"><option value="citizen" ${u.role=='citizen'?'selected':''}>громадянин</option><option value="admin" ${u.role=='admin'?'selected':''}>адміністратор</option></select>
 <button class="btn" data-act="usave">${isNew?'Створити':'Зберегти зміни'}</button><button class="btn ghost" data-act="close">Скасувати</button>`)}
async function usave(){const g=i=>$('#uf_'+i).value.trim(),e=S.ef,em=g('email').toLowerCase();
 if(!g('name')||!g('surname'))return toast('Ім’я та прізвище обов’язкові.');
 if(!/^\S+@\S+\.\S+$/.test(em))return inlineError('#uf_email','Введіть коректну адресу пошти.');
 if(!/^\d{10}$/.test(g('tax')))return inlineError('#uf_tax','РНОКПП має містити рівно 10 цифр.');
 if(!/^\d{9}$/.test(g('pid')))return inlineError('#uf_pid','Номер паспорта має містити рівно 9 цифр.');
 if(e.isNew&&g('pass').length<6)return toast('Пароль має містити щонайменше 6 символів.');
 try{const ex=await db.findByEmail(em);if(ex&&ex.id!==e.id)return toast('Цю пошту вже використовує інший акаунт.');
 const p={name:g('name'),surname:g('surname'),email:em,city:g('city'),dob:g('dob'),taxId:g('tax'),passport:g('pid'),license:g('lic'),role:$('#uf_role').value,photo:S.pic,vehicle:{...e.base.vehicle,plate:g('plate')},docs:[...document.querySelectorAll('.dk:checked')].map(x=>x.value).filter(k=>eligible({...e.base,...p},k,[]).ok)};
 if(e.isNew){const h=await hashPassword(g('pass')),created={...e.base,...p,id:'u'+Date.now(),...h,status:'verified',flags:[]};delete created.pass;await db.createCitizen(created);A('create',{email:em})}
 else{if(g('pass')){const h=await hashPassword(g('pass'));p.passHash=h.hash;p.passSalt=h.salt;p.pass=null}await db.updateCitizen(e.id,p);A('edit',{id:e.id})}
 modal('');toast(e.isNew?'Громадянина створено':'Зміни збережено');admin()}catch(err){toast('Помилка бази даних: '+err.message)}}
document.addEventListener('change',async e=>{const id=e.target.id;if(id!='ph'&&id!='mphf')return;const f=e.target.files[0];if(!f)return;
 try{const p=await readPhoto(f);if(id=='ph'){S.pic=p;$('#pv').innerHTML=av({...S.ef.base,photo:p})}else{await db.updateCitizen(S.u.id,{photo:p});S.u.photo=p;A('photo');toast('Фото профілю оновлено');menu()}}catch(err){toast('Не вдалося прочитати зображення. Спробуйте JPG або PNG.')}});
/* auto-lock after 2 minutes idle when a PIN is set */
let idle=Date.now();['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>idle=Date.now()));
setInterval(()=>{if(S.u&&!S.pin&&st.get('pin_'+S.u.id)&&Date.now()-idle>12e4){S.pin={mode:'unlock',uid:S.u.id,buf:'',tries:0};render()}},5000);

addEventListener('hashchange',()=>render());
addEventListener('popstate',e=>{if(e.state){S.tab=e.state.tab||S.tab;S.view=e.state.view||S.view;S.atab=e.state.atab||S.atab}render()});
try{const bc=new BroadcastChannel('dovira-events');bc.onmessage=e=>{const n=e.data;if(n&&n.userId===S.u?.id){S.notifications.unshift(n);toast(n.title+': '+n.message);if(S.tab==='feed'&&S.view==='app')feed()}}}catch{}
document.addEventListener('keydown',e=>{
 const dialog=$('#modal .sheet');if(!dialog)return;
 if(e.key==='Escape'){modal('');return}
 if(e.key==='Tab'){
  const els=[...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(x=>x.offsetParent!==null);
  if(!els.length){e.preventDefault();dialog.focus();return}
  const first=els[0],last=els[els.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
});
/* ============ boot ============ */
(async()=>{try{S.notifications=(await idbGet('db_notifications'))||[]}catch{S.notifications=jget('db_notifications',[])}try{if(!history.state)history.replaceState({tab:S.tab,view:S.view,atab:S.atab},'',location.href);const id=st.get('session');if(id){S.u=await db.getCitizen(id);if(S.u){S.view=S.u.role=='admin'?'admin':'app';if(st.get('pin_'+S.u.id))S.pin={mode:'unlock',uid:S.u.id,buf:'',tries:0}}}}catch(e){}render()})();
</script></body></html>
